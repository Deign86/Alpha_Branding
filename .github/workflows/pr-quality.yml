name: PR quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run engine checks
        run: macos/test.sh
      - name: Build macOS app
        run: macos/build.sh

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore Alpha_Branding.sln
      - name: Build
        run: dotnet build Alpha_Branding.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Alpha_Branding.sln --configuration Release --no-build
      - name: Format check
        run: dotnet format Alpha_Branding.sln --verify-no-changes --no-restore
      - name: Publish
        run: dotnet publish src/Alpha.Branding/Alpha.Branding.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/publish
      - name: Package vulnerability audit
        run: dotnet list Alpha_Branding.sln package --vulnerable --include-transitive
      - name: Native application dependency scan
        shell: pwsh
        run: |
          # -w (word match), as in ci.yml, so legitimate identifiers like DragDropReactionBadge
          # don't trip the 'React' token.
          $forbidden = git grep -n -i -w -E 'Tauri|Electron|WebView2|webview|React|Vite|Next\.js|TypeScript|Node\.js' -- src tests
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Forbidden web/wrapper framework references found:`n$forbidden"
            exit 1
          }
          exit 0
      - name: Anti-slop review
        uses: peakoss/anti-slop@v0
        with:
          github-token: ${{ github.token }}
          require-description: true
          require-conventional-title: true
          require-pr-template: true
          blocked-paths: ""
          close-pr: false
          lock-pr: false
          min-account-age: 0
          min-profile-completeness: 0
          min-global-merge-ratio: 0

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Extract version from csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "src\Alpha.Branding\Alpha.Branding.csproj"
          $assemblyVersion = $csproj.Project.PropertyGroup.AssemblyVersion
          if ([string]::IsNullOrEmpty($assemblyVersion)) {
            $version = $csproj.Project.PropertyGroup.Version
            $assemblyVersion = "$version.0"
          }
          Write-Host "Assembly version: $assemblyVersion"
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
      - name: Build EXE installer
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.assembly_version }}"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\installer\Build-Installer.ps1 -Version $version
      - name: Validate EXE installer artifact
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'artifacts\Alpha.Branding.Setup.exe'
          if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) { throw 'EXE installer artifact is missing or empty.' }
      - name: Validate PowerShell installer
        shell: powershell
        run: |
          $testInstallDir = Join-Path ([System.IO.Path]::GetTempPath()) 'AlphaBranding_CiInstallTest'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Install.ps1 -InstallDir $testInstallDir -NoShortcuts -NoRegistry
          $installedExe = Join-Path $testInstallDir 'Alpha.Branding.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "PowerShell installer failed to deploy Alpha.Branding.exe" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Install.ps1 -Uninstall -InstallDir $testInstallDir
      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: Alpha.Branding-Setup
          path: artifacts/Alpha.Branding.Setup.exe
          if-no-files-found: error
