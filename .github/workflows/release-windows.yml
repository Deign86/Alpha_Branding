name: Build and Release Windows Application

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WPF application
        shell: pwsh
        run: dotnet publish src/Alpha.Branding/Alpha.Branding.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/Alpha.Branding

      - name: Create deployment archive
        shell: pwsh
        run: Compress-Archive -Path publish/Alpha.Branding/* -DestinationPath AlphaBranding-1.6.3.zip -CompressionLevel Optimal

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.3
          name: Alpha Premier Branding 1.6.3
          generate_release_notes: true
          files: AlphaBranding-1.6.3.zip
