name: Refresh user manual (temporary)

# Temporary: rebuilds the manual PDF on Windows for this branch, then commits it.
# Removed again before the pull request is opened.
on:
  push:
    branches:
      - claude/fervent-thompson-sa7s3w

permissions:
  contents: write

jobs:
  manual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader for the table of contents
        run: python -m pip install pypdf

      - name: Rebuild PDF
        run: python docs/manual/build.py

      - name: Commit results
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Alpha_Branding_Studio_User_Manual.pdf
          git commit -m "docs(manual): rebuild PDF with the Mac install and update sections"
          git push
