name: Refresh user manual (temporary)

# Temporary: regenerates the manual screenshots and PDF on Windows for this branch, then commits them.
# Removed again before the pull request is opened.
on:
  push:
    branches:
      - claude/fervent-thompson-sa7s3w

permissions:
  contents: write

jobs:
  manual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader for the table of contents
        run: python -m pip install pypdf

      - name: Rebuild screenshots and PDF
        run: python docs/manual/build.py --screenshots

      - name: Copy the crop editor screenshot into the README assets
        shell: pwsh
        run: Copy-Item docs/manual/images/07_crop_editor_pixelate.png docs/assets/app-screenshot-crop-editor.png -Force

      - name: Commit results
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual/images docs/assets/app-screenshot-crop-editor.png docs/Alpha_Branding_Studio_User_Manual.pdf
          git status --short
          git commit -m "docs(manual): regenerate screenshots and PDF for PIXELATE"
          git push
